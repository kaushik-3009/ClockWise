<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Bottom Music Dock Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f3f1;
      --text: #0d0d0d;
      --muted: #8f8f8a;
      --faint: #b9b9b3;
      --line: rgba(0,0,0,.08);
      --surface: rgba(255,255,255,.72);
      --surface-strong: rgba(255,255,255,.9);
      --accent: #ef6b24;
      --accent-soft: rgba(239,107,36,.12);
      --shadow: 0 10px 24px rgba(0,0,0,.08);
      --radius-pill: 999px;
      --radius-lg: 22px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 132px;
      position: relative;
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: auto 50% 90px;
      width: 420px;
      height: 180px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(239,107,36,.06), transparent 70%);
      pointer-events: none;
      filter: blur(12px);
    }

    .stack {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #333;
    }

    .focus-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(0,0,0,.04);
      color: var(--muted);
      font-size: 11px;
    }

    .focus-pill .dot,
    .tiny-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c8c8c2;
    }

    .phase {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .sub {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #777;
      margin-top: -6px;
    }

    .timer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 6px;
      font-weight: 900;
      letter-spacing: -.08em;
      line-height: .9;
      user-select: none;
    }

    .timer span {
      font-size: clamp(92px, 14vw, 152px);
    }

    .timer .colon {
      color: var(--accent);
      transform: translateY(-2px);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 4px;
    }

    .icon-btn, .play-btn, .dock-btn, .tab {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #70706c;
    }

    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(0,0,0,.14);
    }

    .hint-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .hint {
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(0,0,0,.03);
      color: #a2a29b;
      font-size: 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .hint kbd {
      font: inherit;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(0,0,0,.05);
      color: #8d8d86;
    }

    .music-dock {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(740px, calc(100vw - 24px));
      z-index: 20;
    }

    .dock-shell {
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .dock-collapsed,
    .dock-expanded {
      transition: opacity .24s ease, transform .24s ease;
    }

    .dock-collapsed {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px 10px 14px;
    }

    .dock-left {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sound-orb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent), #ffae7e);
      box-shadow: 0 0 0 8px var(--accent-soft);
      flex: 0 0 auto;
    }

    .dock-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dock-meta strong {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dock-meta span {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rhythm {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 12px;
      margin-left: 2px;
      opacity: .8;
    }

    .rhythm span {
      width: 3px;
      border-radius: 999px;
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
      transform-origin: bottom;
    }

    .rhythm span:nth-child(1) { height: 5px; animation-delay: 0s; }
    .rhythm span:nth-child(2) { height: 10px; animation-delay: .12s; }
    .rhythm span:nth-child(3) { height: 7px; animation-delay: .24s; }
    .rhythm span:nth-child(4) { height: 11px; animation-delay: .36s; }

    .dock-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .dock-btn {
      height: 34px;
      min-width: 34px;
      padding: 0 10px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #60605b;
    }

    .dock-btn.primary {
      background: #111;
      color: white;
      min-width: 40px;
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }

    .dock-btn.text {
      padding-inline: 12px;
      background: rgba(0,0,0,.04);
      font-size: 12px;
      color: var(--muted);
    }

    .dock-expanded {
      display: none;
      border-top: 1px solid rgba(0,0,0,.05);
      padding: 12px;
      background: rgba(255,255,255,.42);
    }

    .music-dock[data-open="true"] .dock-expanded {
      display: grid;
      gap: 12px;
    }

    .music-dock[data-open="true"] .expand-label::after {
      content: "Hide";
    }

    .expand-label::after {
      content: "Open";
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      white-space: nowrap;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.05);
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,.5);
    }

    .tab.active {
      background: var(--accent-soft);
      border-color: transparent;
      color: #3f312a;
    }

    .queue {
      display: grid;
      gap: 8px;
    }

    .queue-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 18px;
      background: var(--surface-strong);
      border: 1px solid rgba(0,0,0,.05);
    }

    .queue-item .mini {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(0,0,0,.05);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .queue-item strong {
      display: block;
      font-size: 12px;
      font-weight: 600;
    }

    .queue-item span {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    .badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.04);
      color: #88857e;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes pulse {
      0%, 100% { transform: scaleY(.55); opacity: .42; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rhythm span { animation: none; opacity: .7; }
    }

    @media (max-width: 640px) {
      .screen {
        padding: 20px 16px 122px;
      }

      .controls {
        gap: 16px;
      }

      .music-dock {
        width: calc(100vw - 16px);
        bottom: 8px;
      }

      .dock-collapsed {
        padding: 10px;
      }

      .dock-btn.text {
        padding-inline: 10px;
      }

      .dock-meta strong {
        max-width: 140px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="stack" aria-label="Pomodoro timer layout">
      <div class="title">Focus Time</div>
      <div class="focus-pill"><span class="dot"></span>I'm focusing on...</div>
      <div class="phase">Phase 1 / 8</div>
      <div class="sub">Short break next</div>

      <div class="timer" aria-label="25 minutes remaining">
        <span>25</span>
        <span class="colon">:</span>
        <span>00</span>
      </div>

      <div class="controls" aria-label="Timer controls">
        <button class="icon-btn" aria-label="Reset timer">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path></svg>
        </button>
        <button class="play-btn" aria-label="Start timer">
          <svg viewBox="0 0 24 24"><polygon points="8 5 19 12 8 19 8 5" fill="currentColor" stroke="none"></polygon></svg>
        </button>
        <button class="icon-btn" aria-label="Skip timer">
          <svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7V5z"></path><path d="M19 5v14"></path></svg>
        </button>
      </div>

      <div class="hint-row" aria-label="Keyboard shortcuts">
        <span class="hint"><kbd>Space</kbd> Play/Pause</span>
        <span class="hint"><kbd>R</kbd> Reset</span>
        <span class="hint"><kbd>S</kbd> Skip</span>
        <span class="hint"><kbd>M</kbd> Music</span>
      </div>
    </section>
  </main>

  <section class="music-dock" data-open="false" aria-label="Minimal ambient music dock">
    <div class="dock-shell">
      <div class="dock-collapsed">
        <div class="dock-left">
          <div class="sound-orb" aria-hidden="true"></div>
          <div class="dock-meta">
            <strong>Ambient audio</strong>
            <span>Rain + lofi live, hidden until needed</span>
          </div>
          <div class="rhythm" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="dock-actions">
          <button class="dock-btn" aria-label="Previous sound">
            <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16z"></path><path d="M5 19V5"></path></svg>
          </button>
          <button class="dock-btn primary" aria-label="Play audio">
            <svg viewBox="0 0 24 24"><polygon points="8 5 19 12 8 19 8 5" fill="currentColor" stroke="none"></polygon></svg>
          </button>
          <button class="dock-btn" aria-label="Next sound">
            <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"></path><path d="M19 5v14"></path></svg>
          </button>
          <button class="dock-btn text toggle-expand" aria-label="Open music options"><span class="expand-label"></span></button>
        </div>
      </div>

      <div class="dock-expanded">
        <div class="tabs" aria-label="Audio categories">
          <button class="tab active">Lofi live</button>
          <button class="tab">Rain</button>
          <button class="tab">Cafe</button>
          <button class="tab">Brown noise</button>
        </div>

        <div class="queue">
          <div class="queue-item">
            <div class="mini">YT</div>
            <div>
              <strong>Night Channel</strong>
              <span>YouTube stream state</span>
            </div>
            <div class="badge">Live</div>
          </div>
          <div class="queue-item">
            <div class="mini">AM</div>
            <div>
              <strong>Soft Rain Loop</strong>
              <span>Low distraction ambience</span>
            </div>
            <div class="badge">Loop</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const dock = document.querySelector('.music-dock');
    const toggle = document.querySelector('.toggle-expand');
    toggle.addEventListener('click', () => {
      dock.dataset.open = dock.dataset.open === 'true' ? 'false' : 'true';
    });
  </script>
</body>
</html>
